name: CI

on:
  push:
    branches: [main, ready-to-launch]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type-check · Lint · Test · Build
    runs-on: ubuntu-latest

    env:
      # Stub secrets so build/type-check don't fail on missing env vars.
      # Real values are only needed at runtime, not at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      ARCJET_KEY: ajkey_placeholder
      SENTRY_DSN: https://placeholder@o0.ingest.sentry.io/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage --passWithNoTests --forceExit
        env:
          CI: true

      - name: Build
        run: npm run build
